  <title id="title">센서 실험실 — 기본형의 평면 표현</title>
  <desc id="desc">큰 곡률의 프레임과 네 방향 초점 눈금 안에 오른쪽이 열린 궤도를 배치했다. 아래쪽 궤도는 이어지고 위쪽 주황 호 끝에는 신호점이 연결된다. 오른쪽 눈금의 바깥 끝은 짧게 조정했다.</desc>
